name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  csharp-tests:
    name: C# tests
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore test project
        run: dotnet restore tests/GammaVannaCharm.Core.Tests/GammaVannaCharm.Core.Tests.csproj

      - name: Run C# tests
        run: dotnet test tests/GammaVannaCharm.Core.Tests/GammaVannaCharm.Core.Tests.csproj --no-restore --configuration Release --verbosity normal
